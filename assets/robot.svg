    <path d="M44 100 L31 106 L47 110 L54 102 Z" fill="#3A4A5D" stroke="#1C2A3A" stroke-width="1.2"/>
    <path d="M76 100 L89 106 L73 110 L66 102 Z" fill="#3A4A5D" stroke="#1C2A3A" stroke-width="1.2"/>

    <path d="M63 18 L69 7" stroke="#7DF9FF" stroke-width="3" stroke-linecap="round" filter="url(#thinGlow)"/>
    <circle cx="70" cy="6" r="4.5" fill="url(#cyanGlow)" filter="url(#neon)"/>
  </g>
</svg>
