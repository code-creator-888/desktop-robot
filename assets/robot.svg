<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="pearlShell" x1="24" y1="10" x2="92" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.52" stop-color="#E6FCFF"/>
      <stop offset="1" stop-color="#8AA8BD"/>
    </linearGradient>
    <linearGradient id="glass" x1="33" y1="30" x2="86" y2="67" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B3A55"/>
      <stop offset="0.55" stop-color="#071426"/>
      <stop offset="1" stop-color="#020711"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9FFFF"/>
      <stop offset="1" stop-color="#29D6FF"/>
    </linearGradient>
    <linearGradient id="violetGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2D9FF"/>
      <stop offset="1" stop-color="#8E6CFF"/>
    </linearGradient>
    <filter id="softDepth" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="3" dy="7" stdDeviation="3" flood-color="#00111C" flood-opacity="0.38"/>
    </filter>
    <filter id="neon" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="thinGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <ellipse cx="60" cy="107" rx="31" ry="7" fill="#00111C" opacity="0.24"/>
  <g id="hologramRing" filter="url(#neon)" opacity="0.72">
    <ellipse cx="60" cy="61" rx="48" ry="33" fill="none" stroke="#68F7FF" stroke-width="2.8" stroke-dasharray="12 8" transform="rotate(-18 60 61)"/>
    <ellipse cx="60" cy="60" rx="35" ry="23" fill="none" stroke="#9A7DFF" stroke-width="1.7" opacity="0.75" transform="rotate(22 60 60)"/>
  </g>

  <g id="prismShell" filter="url(#softDepth)">
    <path d="M24 47 L12 71 L30 82 L40 57 Z" fill="#5D6AFF" opacity="0.38" stroke="#A8F8FF" stroke-width="1.4"/>
    <path d="M96 47 L108 71 L90 82 L80 57 Z" fill="#5D6AFF" opacity="0.38" stroke="#A8F8FF" stroke-width="1.4"/>

    <path d="M33 20 L75 17 Q91 17 96 31 L91 63 Q89 75 75 78 L39 76 Q27 75 24 63 L23 36 Q23 24 33 20 Z" fill="url(#pearlShell)" stroke="#94C6D9" stroke-width="2"/>
    <path d="M75 17 Q91 17 96 31 L91 63 Q89 75 75 78 L82 45 Z" fill="#A5C6D6" opacity="0.58"/>

    <path d="M36 31 L75 29 Q85 29 87 38 L84 56 Q82 64 72 65 L40 63 Q31 62 30 54 L29 40 Q29 32 36 31 Z" fill="url(#glass)" stroke="#59F1FF" stroke-width="2"/>
    <path d="M39 35 L72 33" stroke="#D3FFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.38"/>
    <path d="M36 39 L84 38" stroke="#59F1FF" stroke-width="1" opacity="0.42" filter="url(#thinGlow)"/>

    <g filter="url(#neon)">
