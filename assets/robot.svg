      <ellipse cx="69" cy="48" rx="8.5" ry="4.8" fill="url(#cyanGlow)"/>
      <rect x="51" y="58" width="16" height="3.8" rx="1.9" fill="url(#violetGlow)"/>
    </g>

    <path d="M40 75 L75 76 Q86 77 88 88 L84 101 L35 100 L31 87 Q31 77 40 75 Z" fill="url(#pearlShell)" stroke="#94C6D9" stroke-width="2"/>
    <path d="M75 76 Q86 77 88 88 L84 101 L72 95 L72 81 Z" fill="#8FAFC1" opacity="0.62"/>
    <rect x="45" y="82" width="30" height="15" rx="7" fill="#06101D" stroke="#A68DFF" stroke-width="2"/>
    <circle id="gravityCore" cx="60" cy="89.5" r="5.8" fill="url(#violetGlow)" filter="url(#neon)"/>

    <g id="thrusterLeft">
